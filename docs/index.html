<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confluence DOC to Markdown</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <section class="workspace" aria-labelledby="app-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">Confluence Export Converter</p>
          <h1 id="app-title">Confluence DOC to Markdown</h1>
        </div>
        <button class="icon-button" id="clearButton" type="button" title="초기화" aria-label="초기화">
          <span aria-hidden="true">↺</span>
        </button>
      </header>

      <section class="upload-area" aria-labelledby="upload-title">
        <div class="upload-copy">
          <h2 id="upload-title">파일 업로드</h2>
          <p>컨플루언스에서 내려받은 `.doc` 파일 여러 개를 올린 뒤 변환하세요.</p>
        </div>

        <label class="drop-zone" id="dropZone">
          <input id="fileInput" type="file" multiple accept=".doc,.docx,.mhtml,.html,.htm,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/html">
          <span class="upload-icon" aria-hidden="true">⇪</span>
          <strong>파일 선택 또는 드래그 앤 드롭</strong>
          <small>.doc, .docx, .mhtml, .html</small>
        </label>

        <div class="command-row">
          <span class="status-pill" id="statusLabel">대기 중</span>
          <button class="primary-button" id="convertButton" type="button" disabled>변환</button>
          <button id="downloadZipButton" type="button" disabled>ZIP 다운로드</button>
        </div>

        <div class="notice" id="noticeBox">
          모든 변환은 브라우저 안에서만 실행됩니다. 파일은 서버로 업로드되지 않습니다.
        </div>
      </section>

      <section class="result-area" aria-labelledby="result-title">
        <div class="section-head">
          <h2 id="result-title">변환 목록</h2>
          <span id="summaryText">선택된 파일 없음</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>파일명</th>
                <th>크기</th>
                <th>상태</th>
                <th>다운로드</th>
              </tr>
            </thead>
            <tbody id="fileRows">
              <tr class="empty-row">
                <td colspan="4">파일을 추가하면 여기에 표시됩니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
